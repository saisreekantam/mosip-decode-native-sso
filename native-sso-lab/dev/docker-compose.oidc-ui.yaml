# eSignet login UI (oidc-ui) for local Native SSO development: eSignet itself runs from source on
# the host (./make.sh run), so the UI's API proxy points at host.docker.internal instead of the
# esignet container. Phones/emulators reach both through `adb reverse tcp:3000 tcp:3000` and
# `adb reverse tcp:8080 tcp:8080`.
services:
  esignet-ui:
    image: "mosipid/oidc-ui:2.0.0"
    user: root
    ports:
      - 3000:3000
    environment:
      - container_user=mosip
      - DEFAULT_LANG=en
      - DEFAULT_WELLKNOWN=%5B%7B%22name%22%3A%22OpenID%20Configuration%22%2C%22value%22%3A%22%2F.well-known%2Fopenid-configuration%22%7D%2C%7B%22name%22%3A%22Jwks%20Json%22%2C%22value%22%3A%22%2F.well-known%2Fjwks.json%22%7D%2C%7B%22name%22%3A%22Authorization%20Server%22%2C%22value%22%3A%22%2F.well-known%2Foauth-authorization-server%22%7D%5D
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./oidc-ui-nginx.conf:/etc/nginx/nginx.conf
