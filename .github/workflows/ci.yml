name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (ThunderID + eSignet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone the ThunderID and eSignet forks (feature/native-sso)
        run: scripts/setup.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: thunderid/backend/go.mod
          cache-dependency-path: |
            thunderid/backend/go.sum
            esignet/esignet-service/go.sum
      - name: ThunderID OAuth and engine tests
        working-directory: thunderid/backend
        run: go test ./internal/oauth/... ./pkg/thunderidengine/... -count=1
      - name: eSignet tests
        working-directory: esignet/esignet-service
        env:
          CGO_ENABLED: "0"
        run: go test ./... -count=1
      - name: Fuzz the Native SSO scope rules and device secret validation
        run: |
          (cd thunderid/backend && go test ./internal/oauth/oauth2/granthandlers/ -run '^$' -fuzz FuzzNativeSSOScopes -fuzztime 30s)
          (cd esignet/esignet-service && CGO_ENABLED=0 go test ./internal/engine/ -run '^$' -fuzz FuzzValidateDeviceSecret -fuzztime 30s)
      - name: Vet the test lab
        working-directory: native-sso-lab
        run: go vet ./...

  android:
    name: Android apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - name: Unit tests and APKs
        working-directory: native-sso-android
        run: ./gradlew --no-daemon :sso-core:testDebugUnitTest :super-app:assembleDebug :child-app:assembleDebug :child-app:assembleRogue
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            native-sso-android/super-app/build/outputs/apk/debug/super-app-debug.apk
            native-sso-android/child-app/build/outputs/apk/debug/child-app-debug.apk
            native-sso-android/child-app/build/outputs/apk/rogue/child-app-rogue.apk

  e2e:
    name: Live end-to-end (20 scenarios + Postman)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Clone the forks
        run: scripts/setup.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: thunderid/backend/go.mod
          cache-dependency-path: |
            thunderid/backend/go.sum
            esignet/esignet-service/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start Postgres, the mock identity system, the login UI and eSignet
        run: scripts/dev-up.sh
      - name: End-to-end scenarios against the live eSignet
        working-directory: native-sso-lab
        run: go run . -report results.json
      - name: Postman collection, Native SSO path
        run: native-sso-lab/postman/run-native-sso.sh
      - name: eSignet log on failure
        if: failure()
        run: tail -200 /tmp/esignet-run.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: native-sso-lab/results.json

  mutation:
    name: Mutation testing (16 security checks)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Clone the forks
        run: scripts/setup.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: thunderid/backend/go.mod
          cache-dependency-path: |
            thunderid/backend/go.sum
            esignet/esignet-service/go.sum
      - name: Disable each security check and expect a failing test
        working-directory: native-sso-lab
        run: python3 mutation/mutate.py --report mutation-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: native-sso-lab/mutation-report.json
